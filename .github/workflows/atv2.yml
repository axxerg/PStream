name: update-stream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: python -m pip install requests

      - name: Run ATV
        run: python src/atv.py

      - name: Check output
        run: |
          echo "===== OUTPUT ====="
          ls -la
          ls -la output || true

          if [ ! -f output/atv.m3u8 ]; then
            echo "ERROR: output/atv.m3u8 wurde nicht erzeugt."
            exit 1
          fi

          echo "ATV M3U8 gefunden:"
          cat output/atv.m3u8

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add output/atv.m3u8

          git diff --cached --quiet || git commit -m "Update ATV stream"

          git pull --rebase origin main
          git push
