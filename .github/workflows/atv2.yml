name: update-stream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ATV extractor
        run: |
          python src/atv.py

      - name: Check generated M3U8
        run: |
          echo "========== ATV M3U8 =========="

          if [ -f output/atv.m3u8 ]; then
            cat output/atv.m3u8
          else
            echo "ERROR: output/atv.m3u8 wurde nicht erzeugt."
            exit 1
          fi

      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add output/atv.m3u8

          git commit -m "Update ATV stream" || echo "No changes"

          git pull --rebase origin main

          git push
