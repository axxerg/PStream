name: Alle Sender aktualisieren

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sender-aktualisierung
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # Repository laden
      # ==================================================
      - name: Repository klonen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      # ==================================================
      # Python einrichten
      # ==================================================
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # ==================================================
      # Python-Pakete installieren
      # ==================================================
      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      # ==================================================
      # Chromium installieren
      # ==================================================
      - name: Chromium installieren
        run: |
          python -m playwright install --with-deps chromium

      # ==================================================
      # Sicherstellen, dass main aktuell ist
      # ==================================================
      - name: Main-Branch aktualisieren
        run: |
          git fetch origin main
          git reset --hard origin/main

      # ==================================================
      # Streams-Ordner erstellen
      # ==================================================
      - name: Streams-Ordner erstellen
        run: |
          mkdir -p streams

      # ==================================================
      # Sender-Scanner starten
      # ==================================================
      - name: Sender-Scanner starten
        run: |
          python3 channels.py

      # ==================================================
      # Zeitpunkt speichern
      # ==================================================
      - name: Zeitpunkt der letzten Aktualisierung speichern
        run: |
          echo "Letzte Aktualisierung: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > streams/last_run.txt

      # ==================================================
      # Ergebnisse anzeigen
      # ==================================================
      - name: Ergebnisse anzeigen
        run: |
          echo "======================================"
          echo "TURK TV SCANNER"
          echo "======================================"
          echo "Start: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "Streams:"
          ls -lah streams/ || true
          echo ""
          echo "Playlist:"
          ls -lah 2026/playlist.m3u || true
          echo ""
          echo "Letzte Aktualisierung:"
          cat streams/last_run.txt || true
          echo "======================================"

      # ==================================================
      # Git konfigurieren
      # ==================================================
      - name: Git konfigurieren
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # ==================================================
      # Änderungen vorbereiten
      # ==================================================
      - name: Änderungen vorbereiten
        run: |
          git add streams/
          git add 2026/playlist.m3u

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

      # ==================================================
      # Commit erstellen
      # ==================================================
      - name: Änderungen committen
        run: |
          git commit -m "Sender aktualisiert $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      # ==================================================
      # Zu GitHub übertragen
      # ==================================================
      - name: Änderungen zu GitHub übertragen
        run: |
          git push origin main
