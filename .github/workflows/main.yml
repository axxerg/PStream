name: Update All Channels

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

concurrency:
  group: update-all-channels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Repoyu klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Python paketlərini qur
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Chromium qur
        run: |
          python -m playwright install --with-deps chromium

      - name: Main branch-i yenilə
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Streams qovluğunu yarat
        run: |
          mkdir -p streams

      - name: Kanal scanner-i işə sal
        run: |
          python3 channels.py

      - name: Last run
        run: |
          echo "Son yenilenme: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            > streams/last_run.txt

      - name: Nəticələri göstər
        run: |
          echo ""
          echo "======================================"
          echo "YARADILAN FAYLLAR"
          echo "======================================"

          ls -lah streams/

          echo ""
          echo "======================================"
          echo "M3U FAYLLARI"
          echo "======================================"

          shopt -s nullglob

          for file in streams/*.m3u; do
            echo ""
            echo "========== $file =========="
            cat "$file"
          done

          echo ""
          echo "======================================"
          echo "ERROR FAYLLARI"
          echo "======================================"

          for file in streams/*.error.txt; do
            echo ""
            echo "========== $file =========="
            cat "$file"
          done

      - name: Git config
        run: |
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config user.name \
            "github-actions[bot]"

      - name: Dəyişiklikləri commit et
        run: |
          git add streams/

          if git diff --cached --quiet; then
            echo "Dəyişiklik yoxdur."
            exit 0
          fi

          git commit \
            -m "Update all streams $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Push
        run: |
          git push origin HEAD:main
