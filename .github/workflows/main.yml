name: Alle Sender aktualisieren

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
      timezone: "Europe/Berlin"

  workflow_dispatch:

concurrency:
  group: sender-aktualisierung
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aktualisieren:
    runs-on: ubuntu-latest

    steps:
      - name: Repository klonen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Chromium installieren
        run: |
          python -m playwright install --with-deps chromium

      - name: Main-Branch aktualisieren
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Streams-Ordner erstellen
        run: |
          mkdir -p streams

      - name: Sender-Scanner starten
        run: |
          echo "======================================"
          echo "TURK TV SCANNER"
          echo "======================================"
          echo "Start UTC:     $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Start Hamburg: $(TZ=Europe/Berlin date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "======================================"

          python3 channels.py

      - name: Zeitpunkt speichern
        run: |
          echo "Letzte Aktualisierung UTC: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > streams/last_run.txt
          echo "Letzte Aktualisierung Hamburg: $(TZ=Europe/Berlin date +'%Y-%m-%d %H:%M:%S %Z')" >> streams/last_run.txt

      - name: Ergebnisse anzeigen
        run: |
          echo "======================================"
          echo "TURK TV SCANNER"
          echo "======================================"
          echo "UTC:"
          date -u
          echo ""
          echo "Hamburg:"
          TZ=Europe/Berlin date
          echo ""
          echo "Streams:"
          ls -lah streams/ || true
          echo ""
          echo "Playlist:"
          ls -lah 2026/playlist.m3u || true
          echo ""
          echo "Letzte Aktualisierung:"
          cat streams/last_run.txt || true
          echo "======================================"

      - name: Git konfigurieren
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Änderungen prüfen
        id: changes
        run: |
          git add streams/
          git add 2026/playlist.m3u

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Änderungen gefunden."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Änderungen committen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "Sender aktualisiert $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Zu GitHub übertragen
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin main
