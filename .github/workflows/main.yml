name: Alle Sender aktualisieren

on:
  schedule:
    # Alle 15 Minuten ausführen
    - cron: '*/15 * * * *'

  # Manueller Start über GitHub Actions
  workflow_dispatch:


# ============================================================
# KONKURRENZ
# ============================================================

concurrency:
  group: sender-aktualisierung
  cancel-in-progress: false


# ============================================================
# BERECHTIGUNGEN
# ============================================================

permissions:
  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  aktualisieren:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # REPOSITORY
      # ======================================================

      - name: Repository klonen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip


      # ======================================================
      # PYTHON-PAKETE
      # ======================================================

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright


      # ======================================================
      # CHROMIUM
      # ======================================================

      - name: Chromium installieren
        run: |
          python -m playwright install --with-deps chromium


      # ======================================================
      # MAIN-BRANCH AKTUALISIEREN
      # ======================================================

      - name: Main-Branch aktualisieren
        run: |
          git fetch origin main
          git reset --hard origin/main


      # ======================================================
      # STREAMS-ORDNER
      # ======================================================

      - name: Streams-Ordner erstellen
        run: |
          mkdir -p streams


      # ======================================================
      # KANAL-SCANNER
      # ======================================================

      - name: Sender-Scanner starten
        run: |
          python3 channels.py


      # ======================================================
      # LETZTE AKTUALISIERUNG
      # ======================================================

      - name: Zeitpunkt der letzten Aktualisierung speichern
        run: |
          echo "Letzte Aktualisierung: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            > streams/last_run.txt


      # ======================================================
      # ERGEBNISSE ANZEIGEN
      # ======================================================

      - name: Ergebnisse anzeigen
        run: |

          echo ""
          echo "======================================"
          echo "ERSTELLTE DATEIEN"
          echo "======================================"

          ls -lah streams/


          echo ""
          echo "======================================"
          echo "M3U-DATEIEN"
          echo "======================================"

          shopt -s nullglob

          for file in streams/*.m3u; do

            echo ""
            echo "========== $file =========="

            cat "$file"

          done


          echo ""
          echo "======================================"
          echo "M3U8-DATEIEN"
          echo "======================================"

          for file in streams/*.m3u8; do

            echo ""
            echo "========== $file =========="

            head -30 "$file"

          done


          echo ""
          echo "======================================"
          echo "FEHLERDATEIEN"
          echo "======================================"

          for file in streams/*.error.txt; do

            echo ""
            echo "========== $file =========="

            cat "$file"

          done


      # ======================================================
      # GIT KONFIGURIEREN
      # ======================================================

      - name: Git konfigurieren
        run: |

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config user.name \
            "github-actions[bot]"


      # ======================================================
      # ÄNDERUNGEN COMMITTEN
      # ======================================================

      - name: Änderungen committen
        run: |

          echo ""
          echo "======================================"
          echo "ÄNDERUNGEN PRÜFEN"
          echo "======================================"

          git status --short


          # Streams-Dateien hinzufügen
          git add streams/


          # Hauptplaylist hinzufügen
          git add 2026/playlist.m3u


          echo ""
          echo "======================================"
          echo "VORBEREITETE ÄNDERUNGEN"
          echo "======================================"

          git diff --cached --stat


          # Prüfen, ob überhaupt Änderungen vorhanden sind
          if git diff --cached --quiet; then

            echo ""
            echo "Keine Änderungen vorhanden."

            exit 0

          fi


          # Commit erstellen
          git commit \
            -m "Sender aktualisiert $(date -u +'%Y-%m-%d %H:%M:%S UTC')"


      # ======================================================
      # PUSH ZU GITHUB
      # ======================================================

      - name: Änderungen zu GitHub übertragen
        run: |

          echo ""
          echo "======================================"
          echo "PUSH"
          echo "======================================"

          git push origin HEAD:main

          echo ""
          echo "Änderungen erfolgreich zu GitHub übertragen."
